name: Update Pixela Blog Graph

on:
  push:
    branches: [main]
    paths: ['src/_posts/**']

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version

      - name: Update Pixela blog graph
        env:
          PIXELA_USERNAME: ${{ secrets.PIXELA_USERNAME }}
          PIXELA_USER_TOKEN: ${{ secrets.PIXELA_USER_TOKEN }}
        run: |
          BEFORE="${{ github.event.before }}"
          # Handle first push to branch (before is all-zeros)
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          fi
          git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" \
            | grep -E '^src/_posts/.*\.md$' \
            | ruby scripts/update_blog_graph.rb
