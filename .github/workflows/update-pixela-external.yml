name: Update Pixela External Graph

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version

      - name: Update Pixela external graph
        env:
          PIXELA_USERNAME: ${{ secrets.PIXELA_USERNAME }}
          PIXELA_USER_TOKEN: ${{ secrets.PIXELA_USER_TOKEN }}
        run: ruby scripts/update_external_graph.rb
